# Defaults applied by DualPoolConfig.load. A service overrides only what differs.
#
# The write pool is read from `db`, which keeps whatever name it already has. `readDb` is optional: absent,
# or `enabled = false`, and reads use `db`.
dualpool {

  # How many instances (pods) of this service run. Used by the startup sizing check only:
  # instances * sum(maxConnections) has to stay within the database's connection limit.
  instances = 1
  instances = ${?DUALPOOL_INSTANCES}

  # The database's max_connections, when the service knows it. Unset means the sizing check only logs.
  # databaseConnectionLimit = 100
  databaseConnectionLimit = ${?DUALPOOL_DB_CONNECTION_LIMIT}

  # Applied to every pool that does not set the key itself.
  defaults {
    numThreads = 10
    maxConnections = 10
    queueSize = 500
    connectionTimeout = 5s
  }

  # Applied to the read pool on top of `defaults`. Reads favour a short wait and fast rejection; a write may
  # justify waiting longer.
  read-defaults {
    queueSize = 200
    connectionTimeout = 2s
  }
}
