# Defaults picked up by DualPoolConfig.load. Services override only what differs.
# `db` (write pool) keeps its existing name; `readDb` is optional: absent => reads use `db`.
dualpool {
  defaults {
    numThreads = 10
    maxConnections = 10
    queueSize = 500
    connectionTimeout = 5s
  }
  read-defaults {
    queueSize = 200
    connectionTimeout = 2s
    # readOnly = true   # optional: reject writes on the read pool (not in the proposal; opt-in)
  }
}
