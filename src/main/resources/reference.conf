# Defaults picked up by DualPoolConfig.load. Services override only what differs.
# `db` (write pool) keeps its existing name; `readDb` is optional: absent or `enabled = false` => reads use `db`.
dualpool {
  # How many instances (pods) of this service run. Used by the startup sizing check only:
  # instances * sum(maxConnections) must stay within the database's connection limit.
  instances = 1
  instances = ${?DUALPOOL_INSTANCES}

  # The database's max_connections, when the service knows it. Unset means the sizing check only logs.
  # databaseConnectionLimit = 100
  databaseConnectionLimit = ${?DUALPOOL_DB_CONNECTION_LIMIT}

  defaults {
    numThreads = 10
    maxConnections = 10
    queueSize = 500
    connectionTimeout = 5s
  }
  read-defaults {
    # Reads favour a short wait and fast rejection; writes may justify longer waits (proposal 4.3).
    queueSize = 200
    connectionTimeout = 2s
    # readOnly = true   # optional: reject writes on the read pool (not in the proposal; opt-in)
  }
}
